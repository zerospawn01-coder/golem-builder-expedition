name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify shared damage evaluation
        run: pnpm verify:damage

      - name: Verify Gravity Depth contracts
        run: pnpm verify:gravity-depth

      - name: Verify fabrication transaction
        run: pnpm verify:fabrication

      - name: Verify R2 Blueprint Library gates
        run: pnpm verify:r2-blueprints
